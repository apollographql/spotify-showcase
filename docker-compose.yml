# Running instructions:
# put your apollo key and graph ref in a `.env` file in the root folder EG:
# APOLLO_GRAPH_REF="YOUR_GRAPH_REF@YOUR_VARIANT"
# APOLLO_KEY="YOUR_APOLLO_KEY"
#
# run `docker-compose --env-file .env up -d`
#
# run the frontend:
# `npm i && npm run start`
version: '3.9'
services:
  router:
    environment:
      APOLLO_KEY: ${APOLLO_KEY}
      APOLLO_GRAPH_REF: ${APOLLO_GRAPH_REF}
      CALLBACK_URL: ${CALLBACK_URL}
      WAIT: true
    build: router
    ports:
      - 4000:4000
    depends_on:
      - playback
      - spotify
  playback:
    build:
      # we use context . because we need access to the shared directory
      context: .
      dockerfile: subgraphs/playback/Dockerfile
    # we don't need to use the ports directive since only the router needs to talk to subgraphs
    expose:
      - 4002
  spotify:
    build:
      # we use context . because we need access to the shared directory
      context: .
      dockerfile: subgraphs/spotify/Dockerfile
    # we don't need to use the ports directive since only the router needs to talk to subgraphs
    expose:
      - 4001

  # 🤖 Apollo MCP Server
  mcp_server:
    image: ghcr.io/apollographql/apollo-mcp-server:latest
    container_name: mcp_server
    ports:
      - "8000:8000"
    volumes:      
      - ./mcp/operations:/operations
      - ./mcp/config.yaml:/config.yaml
    environment:
      LOG_LEVEL: error
      APOLLO_KEY: ${APOLLO_KEY}
      APOLLO_GRAPH_REF: ${APOLLO_GRAPH_REF}
    command: ["/config.yaml"]
    expose:
      - 8000

  ai-helper:
    build: 
      context: ./ai-helper
    command: ["npx", "tsx", "src/controller.ts"]
    #command: ["tail", "-f", "/dev/null"]
    container_name: ai-helper
    ports:
      - "4005:4005"
    volumes:
      - ./ai-helper:/app
      - /app/node_modules
    environment:
      - NODE_ENV=production      
      - MCP_ENDPOINT=${MCP_ENDPOINT}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - mcp_server
    expose:
      - 4005