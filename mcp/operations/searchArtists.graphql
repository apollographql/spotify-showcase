query SearchArtists($q: String!, $type: [SearchType!]!, $limit: Int) {
  search(q: $q, type: $type, limit: $limit) {
    tracks {
      edges {
        node {
          name
          id
          durationMs
          popularity
          trackNumber
          album {
            name
          }
          artists {
            name
          }
        }
      }
    }
  }
}